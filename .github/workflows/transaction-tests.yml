name: Transaction core tests

on:
  push:
    branches: [main]
    paths:
      - 'src/core/Transactions.ps1'
      - 'src/core/RegistryAdapter.ps1'
      - 'tests/transactions-*.ps1'
      - '.github/workflows/transaction-tests.yml'
  pull_request:
    paths:
      - 'src/core/Transactions.ps1'
      - 'src/core/RegistryAdapter.ps1'
      - 'tests/transactions-*.ps1'
      - '.github/workflows/transaction-tests.yml'

permissions:
  contents: read

jobs:
  mock:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Mock transactional logic
        shell: pwsh
        run: ./tests/transactions-mock.ps1
      - name: HKCU isolated integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/transactions-windows.ps1
