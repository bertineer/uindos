name: Baseline smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'tests/**'
      - '.github/workflows/baseline-tests.yml'
  pull_request:
    paths:
      - 'src/core/**'
      - 'tests/**'
      - '.github/workflows/baseline-tests.yml'

permissions:
  contents: read

jobs:
  baseline:
    name: Smoke / ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell mock tests
        shell: pwsh
        run: ./tests/baseline-smoke.ps1
      - name: Test provisioned AppX compatibility logic (mock only)
        shell: pwsh
        run: ./tests/provisioned-appx-mock.ps1
      - name: Run live Windows read-only inventory (no data uploaded)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $json = & ./bin/uindos-baseline.ps1 | Out-String
          if ([string]::IsNullOrWhiteSpace($json)) { throw 'Baseline returned no JSON.' }
          $result = $json | ConvertFrom-Json
          if ($result.schema -ne 'uindos.baseline/v1') { throw 'Invalid baseline schema.' }
          if ($result.probes.os.status -ne 'ok') { throw 'OS probe failed on Windows.' }
          if ($result.probes.selectedServices.status -ne 'ok') { throw 'Service probe failed on Windows.' }
          if (@($result.probes.os.data).Count -ne 1) { throw 'OS details missing.' }
          Write-Output 'PASS: Windows inventory invoked and JSON structure verified; inventory not printed.'
