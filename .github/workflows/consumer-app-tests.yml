name: Curated consumer app tests
on:
  push:
    branches: [main]
    paths:
      - 'src/foundation/ConsumerApps.ps1'
      - 'bin/uindos-debloat.ps1'
      - 'tests/consumer-apps-*.ps1'
      - '.github/workflows/consumer-app-tests.yml'
  pull_request:
    paths:
      - 'src/foundation/ConsumerApps.ps1'
      - 'bin/uindos-debloat.ps1'
      - 'tests/consumer-apps-*.ps1'
      - '.github/workflows/consumer-app-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Portable mock-only package tests
        shell: pwsh
        run: ./tests/consumer-apps-mock.ps1
      - name: Windows live AppX inventory only (no removal)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/consumer-apps-windows-readonly.ps1
