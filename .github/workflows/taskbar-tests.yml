name: Taskbar visibility tests
on:
  push:
    branches: [main]
    paths:
      - 'src/foundation/Taskbar.ps1'
      - 'bin/uindos-taskbar.ps1'
      - 'tests/taskbar-mock.ps1'
      - '.github/workflows/taskbar-tests.yml'
  pull_request:
    paths:
      - 'src/foundation/Taskbar.ps1'
      - 'bin/uindos-taskbar.ps1'
      - 'tests/taskbar-mock.ps1'
      - '.github/workflows/taskbar-tests.yml'
permissions:
  contents: read
jobs:
  taskbar:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cross-platform mocked taskbar preference tests
        shell: pwsh
        run: ./tests/taskbar-mock.ps1
