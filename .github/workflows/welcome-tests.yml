name: Welcome visibility tests
on:
  push:
    branches: [main]
    paths:
      - 'src/foundation/Welcome.ps1'
      - 'bin/uindos-welcome.ps1'
      - 'tests/welcome-mock.ps1'
      - '.github/workflows/welcome-tests.yml'
  pull_request:
    paths:
      - 'src/foundation/Welcome.ps1'
      - 'bin/uindos-welcome.ps1'
      - 'tests/welcome-mock.ps1'
      - '.github/workflows/welcome-tests.yml'
permissions:
  contents: read
jobs:
  welcome:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cross-platform mocked welcome preference tests
        shell: pwsh
        run: ./tests/welcome-mock.ps1
